<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>カレンダー</title>
    <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}">
</head>
<body>
    <main class="container">
        <h1 class="page-title" id="calendar-title"
            th:text="${currentMonth.year + '年' + currentMonth.monthValue + '月'}">カレンダー</h1>
        <nav class="calendar-navigation" aria-label="カレンダーの操作">
            <div class="calendar-navigation-group">
                <a class="btn sub" th:href="@{/calendar(year=${previousMonth.year},month=${previousMonth.monthValue})}">前の月</a>
                <a class="btn sub" th:href="@{/calendar(year=${nextMonth.year},month=${nextMonth.monthValue})}">次の月</a>
            </div>
            <div class="calendar-navigation-group">
                <a class="btn sub" th:href="@{/todos}">表で見る</a>
                <a class="btn" th:href="@{/todos/new}">新規登録</a>
            </div>
        </nav>
        <table class="calendar-table" aria-labelledby="calendar-title"
               th:attr="data-from=${firstDate},data-to=${lastDate}">
            <thead>
                <tr>
                    <th scope="col">日</th>
                    <th scope="col">月</th>
                    <th scope="col">火</th>
                    <th scope="col">水</th>
                    <th scope="col">木</th>
                    <th scope="col">金</th>
                    <th scope="col">土</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="week : ${weeks}">
                    <td th:each="date : ${week}" th:attr="data-date=${date}">
                        <span th:if="${date != null}" th:text="${date.dayOfMonth}"></span>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
    <script>
        const table = document.querySelector('.calendar-table');
        const params = new URLSearchParams({
            from: table.dataset.from,
            to: table.dataset.to
        });

        async function loadTodos() {
            try {
                const res = await fetch(`/api/todos?${params}`);
                if (!res.ok) {
                    throw new Error('やることを取得できませんでした');
                }
                const todos = await res.json();
                const cells = table.querySelectorAll('td[data-date]');
                const now = new Date();
                const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

                for (const cell of cells) {
                    if (!cell.dataset.date) continue;
                    const dailyTodos = todos.filter(todo => todo.dueDate === cell.dataset.date);
                    for (const todo of dailyTodos.slice(0, 3)) {
                        const name = document.createElement('a');
                        name.className = 'calendar-todo-link';
                        name.href = `/todos/${todo.id}/edit`;
                        name.textContent = todo.title;
                        name.style.color = todo.dueDate < today && !todo.completed ? '#b91c1c' : '#334155';
                        cell.appendChild(name);
                    }
                    if (dailyTodos.length > 3) {
                        const more = document.createElement('div');
                        more.textContent = `ほか ${dailyTodos.length - 3}件`;
                        more.style.color = '#334155';
                        cell.appendChild(more);
                    }
                }
            } catch (error) {
                console.error('やることの読み込みに失敗しました', error);
            }
        }

        async function loadHolidays() {
            const cells = table.querySelectorAll('td[data-date]');
            for (const cell of cells) {
                if (!cell.dataset.date) continue;
                const day = new Date(`${cell.dataset.date}T00:00:00`).getDay();
                if (day === 6) {
                    cell.style.backgroundColor = '#dbeafe';
                } else if (day === 0) {
                    cell.style.backgroundColor = '#fee2e2';
                }
            }

            try {
                const res = await fetch(`/api/holidays?${params}`);
                if (res.headers.has('X-Holidays-Unavailable')) {
                    const message = document.createElement('p');
                    message.textContent = '祝日を取れませんでした';
                    document.querySelector('main').prepend(message);
                }
                if (!res.ok) {
                    throw new Error('祝日を取得できませんでした');
                }
                const holidays = await res.json();
                for (const cell of cells) {
                    const holidayName = holidays[cell.dataset.date];
                    if (holidayName) {
                        cell.style.backgroundColor = '#fef3c7';
                        cell.title = holidayName;
                    }
                }
            } catch (error) {
                console.error('祝日の読み込みに失敗しました', error);
            }
        }

        loadTodos();
        loadHolidays();
    </script>
</body>
</html>
