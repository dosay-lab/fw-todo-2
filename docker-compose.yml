services:
  db:
    image: mysql:8.0
    container_name: fw2-mysql
    environment:
      MYSQL_DATABASE: todoapp
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - fw-db-data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        - CMD-SHELL
        - mysql --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --execute="SELECT 1" todoapp
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  app:
    build: .
    container_name: fw-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/todoapp
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
volumes:
  fw-db-data:
